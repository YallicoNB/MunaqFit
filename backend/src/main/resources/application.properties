spring.application.name=backend

# ===== Base de datos =====
spring.datasource.url=jdbc:mysql://localhost:3306/munaqfit?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate: Spring no arranca si las entidades no coinciden con el esquema.
# El esquema lo crea Flyway (db/migration), ya no schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Flyway (migraciones de base de datos) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== JWT =====
app.jwt.secret=MUNAQFITSMANAGERSECRETKEY2026MUNAQFITSMANAGERSECRETKEY2026CHANGE_ME_IN_PRODUCTION
app.jwt.expiration-ms=86400000

# ===== Server =====
server.port=8080
server.error.include-message=always

# ===== Logs =====
logging.level.com.munaqfit.backend=DEBUG

# ===== Documentacion de la API (Swagger / OpenAPI) =====
# UI: /swagger-ui/index.html   JSON: /v3/api-docs
# springdoc deduce el host solo, asi que la UI sirve en local y en el deploy.
# Define SWAGGER_ENABLED=false en el servidor para ocultarla en produccion.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
