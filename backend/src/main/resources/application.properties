spring.application.name=backend

# ===== Base de datos =====
# En produccion Render/TiDB definen SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD.
# Si no existen, se usan los valores por defecto de MySQL local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/munaqfit?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (HikariCP).
# En produccion la base es TiDB Cloud Starter, cuyo endpoint publico en AWS
# corta las conexiones inactivas a los 340 segundos (limite de AWS Global
# Accelerator) y TiDB avisa que las que permanecen abiertas mas de 30 min
# pueden terminar de forma inesperada. Sin esto, la primera peticion
# despues de un rato de inactividad puede fallar con "Connection reset"
# aunque la base este bien: Hikari entrega la conexion sin validarla.
# max-lifetime por debajo de 340s para reciclar antes de que TiDB la corte,
# keepalive la mantiene viva y validation-timeout hace que Hikari la
# compruebe antes de entregarla al codigo.
# En local (MySQL 3306) no hace falta nada de esto, pero no molesta.
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:240000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE:120000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:3000}

# ===== JPA / Hibernate =====
# validate: Spring no arranca si las entidades no coinciden con el esquema.
# El esquema lo crea Flyway (db/migration), ya no schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Flyway (migraciones de base de datos) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET:MUNAQFITSMANAGERSECRETKEY2026MUNAQFITSMANAGERSECRETKEY2026CHANGE_ME_IN_PRODUCTION}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
# Origenes permitidos separados por coma.
# En produccion: APP_CORS_ALLOWED_ORIGINS=https://munaqfit.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Poner en true solo mientras se configura el deploy.
app.cors.allow-all=${APP_CORS_ALLOW_ALL:false}

# ===== Server =====
# Render inyecta la variable PORT; en local cae en 8080.
server.port=${PORT:8080}
server.error.include-message=always

# ===== Documentacion de la API (Swagger / OpenAPI) =====
# UI: /swagger-ui/index.html   JSON: /v3/api-docs
# springdoc deduce el host solo, asi que la UI sirve en local y en el deploy.
# Define SWAGGER_ENABLED=false en el servidor para ocultarla en produccion.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ===== Logs =====
logging.level.com.munaqfit.backend=${LOG_LEVEL:DEBUG}
