# Perfil de produccion (Render)
# Los secretos llegan por variables de entorno, no por este archivo.
spring.jpa.show-sql=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Logs estructurados (ECS) para que Render los indexe.
logging.structured.format.console=ecs

# No mostrar detalles internos del health en produccion.
management.endpoint.health.show-details=never
