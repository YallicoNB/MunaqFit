<div class="menu">
  <h1 class="titulo">Menú de productos</h1>

  <p *ngIf="error" class="error">{{ error }}</p>
  <p *ngIf="cargando" class="cargando">Cargando menu...</p>

  <div class="menu-contenido" *ngIf="!cargando && bebidas.length">
    <aside class="filtros" aria-label="Filtros de productos">
      <label class="campo-filtro busqueda-filtro">
        <span>Buscar por nombre</span>
        <input
          type="search"
          class="form-control"
          [(ngModel)]="busqueda"
          placeholder="Ej. Latte"
        />
      </label>

      <section class="grupo-filtro" aria-label="Filtrar por precio mínimo">
        <h2 class="titulo-filtro">Precio</h2>
        <button
          *ngFor="let opcion of opcionesPrecio"
          type="button"
          class="opcion-filtro"
          [class.seleccionada]="precioMinimo === opcion.minimo"
          [attr.aria-pressed]="precioMinimo === opcion.minimo"
          (click)="seleccionarPrecio(opcion.minimo)"
        >
          {{ opcion.etiqueta }}
        </button>
      </section>

      <section class="grupo-filtro" *ngIf="categorias.length" aria-label="Filtrar por categoría">
        <h2 class="titulo-filtro">Categorías</h2>
        <button
          type="button"
          class="opcion-filtro"
          [class.seleccionada]="!categoriaSeleccionada"
          [attr.aria-pressed]="!categoriaSeleccionada"
          (click)="seleccionarCategoria(null)"
        >
          <span aria-hidden="true">🍽️</span>
          Todas
        </button>
        <button
          *ngFor="let categoria of categorias"
          type="button"
          class="opcion-filtro"
          [class.seleccionada]="categoriaSeleccionada === categoria"
          [attr.aria-pressed]="categoriaSeleccionada === categoria"
          (click)="seleccionarCategoria(categoria)"
        >
          <span aria-hidden="true">{{ iconoCategoria(categoria) }}</span>
          {{ categoria }}
        </button>
      </section>

      <button type="button" class="btn-limpiar" (click)="limpiarFiltros()">
        Limpiar filtros
      </button>
    </aside>

    <section class="resultados-menu" aria-label="Productos">
      <div class="grid">
        <app-card
          *ngFor="let bebida of bebidasFiltradas"
          [bebida]="bebida"
          [accionable]="false"
        />
      </div>
      <p *ngIf="!bebidasFiltradas.length" class="vacio">
        No hay productos que coincidan con los filtros.
      </p>
    </section>
  </div>

  <p *ngIf="!cargando && !bebidas.length" class="vacio">No hay bebidas registradas.</p>
</div>
