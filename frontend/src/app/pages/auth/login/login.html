<div class="register-container">
  <form class="register-card" (ngSubmit)="iniciarSesion()">
    <h2 class="register-title">Iniciar sesión</h2>

    <div class="form-group">
      <label for="dni">DNI</label>
      <input type="text" id="dni" name="dni" placeholder="Ingresa tu DNI" [(ngModel)]="dni" [disabled]="cargando"
        required />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" [(ngModel)]="password"
        [disabled]="cargando" required />
    </div>

    <p class="error-mensaje" *ngIf="error" role="alert">{{ error }}</p>

    <button type="submit" class="register-button" [disabled]="cargando">
      <span class="spinner" *ngIf="cargando" aria-hidden="true"></span>
      {{ cargando ? 'Iniciando sesión…' : 'Ingresar' }}
    </button>

    <!-- Recuperación de contraseña -->
    <div style="text-align: center; margin-top: 15px;">
      <a routerLink="/auth/forgot-password" style="text-decoration: none; font-size: 0.9em; color: #555;">
        ¿Olvidaste tu contraseña?
      </a>
    </div>
  </form>
</div>
