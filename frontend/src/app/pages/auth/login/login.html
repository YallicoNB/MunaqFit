<div class="register-container">
  <form class="register-card">
    <h2 class="register-title">Iniciar sesión</h2>

    <div class="form-group">
      <label for="dni">DNI</label>
      <input
        type="text"
        id="dni"
        name="dni"
        placeholder="Ingresa tu DNI"
        [(ngModel)]="dni"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Ingresa tu contraseña"
        [(ngModel)]="password"
        required
      />
    </div>

    <button type="button" class="register-button" (click)="iniciarSesion()">Ingresar</button>

    <button routerLink="/register" type="button" class="register-button-link">¿Aún no tienes cuenta? Regístrate</button>
  </form>
</div>
