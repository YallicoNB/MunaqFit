<div class="register-container">
  <form class="register-card" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
    <h2 class="register-title">Iniciar sesión</h2>

    <app-input
      label="DNI"
      tipo="text"
      formControlName="dni"
      placeholder="Ingresa tu DNI"
      autocomplete="username"
      ayuda="8 dígitos, sin espacios"
      [requerido]="true"
      [deshabilitado]="cargando"
    ></app-input>

    <app-input
      label="Contraseña"
      tipo="password"
      formControlName="password"
      placeholder="Ingresa tu contraseña"
      autocomplete="current-password"
      [requerido]="true"
      [deshabilitado]="cargando"
    ></app-input>

    <p class="error-mensaje" *ngIf="error" role="alert">{{ error }}</p>

    <app-boton type="submit" [bloque]="true" [cargando]="cargando">
      {{ cargando ? 'Iniciando sesión…' : 'Ingresar' }}
    </app-boton>

    <div class="mt-3 text-center">
      <a routerLink="/forgot-password" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
    </div>
  </form>
</div>
