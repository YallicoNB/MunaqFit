<div class="container mt-5">
  <h2>Recuperar Contraseña</h2>
  <p>Ingresa tu correo electrónico para buscar tu cuenta.</p>
  <form (ngSubmit)="enviarSolicitud()">
    <div class="mb-3">
      <label for="correo" class="form-label">Correo Electrónico</label>
      <input type="email" id="correo" class="form-control" [(ngModel)]="correo" name="correo" required>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="cargando">
      {{ cargando ? 'Enviando...' : 'Enviar enlace' }}
    </button>
    <a routerLink="/auth/login" class="btn btn-link">Volver al login</a>
  </form>
</div>
