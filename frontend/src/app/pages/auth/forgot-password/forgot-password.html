<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Recuperar Contraseña</h4>

          <div *ngIf="mensajeExito" class="alert alert-success" role="status">
            {{ mensajeExito }}
          </div>

          <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
            {{ mensajeError }}
          </div>

          <form [formGroup]="formulario" (ngSubmit)="solicitarRecuperacion()" novalidate>
            <app-input
              label="Correo electrónico"
              tipo="email"
              formControlName="email"
              id="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              [requerido]="true"
              [deshabilitado]="cargando">
            </app-input>

            <button
              type="submit"
              class="btn btn-primary w-100 mb-3"
              [disabled]="cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              {{ cargando ? 'Enviando…' : 'Enviar enlace de recuperación' }}
            </button>

            <div class="text-center">
              <a routerLink="/login" class="text-decoration-none">Volver al inicio de sesión</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
