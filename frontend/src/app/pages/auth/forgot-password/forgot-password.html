<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Recuperar Contraseña</h4>

          <div *ngIf="mensajeExito" class="alert alert-success">
            {{ mensajeExito }}
          </div>

          <div *ngIf="mensajeError" class="alert alert-danger">
            {{ mensajeError }}
          </div>

          <form (ngSubmit)="solicitarRecuperacion()" #form="ngForm">
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                [(ngModel)]="email"
                required
                [disabled]="cargando">
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 mb-3"
              [disabled]="form.invalid || cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
              Enviar enlace de recuperación
            </button>

            <div class="text-center">
              <a routerLink="/login" class="text-decoration-none">Volver al inicio de sesión</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
