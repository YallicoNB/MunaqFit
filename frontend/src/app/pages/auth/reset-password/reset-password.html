<div class="container mt-5">
  <h2>Nueva Contraseña</h2>
  <form (ngSubmit)="cambiarContrasena()" *ngIf="token; else noToken">
    <div class="mb-3">
      <label for="nuevaContrasena" class="form-label">Escribe tu nueva contraseña</label>
      <input type="password" id="nuevaContrasena" class="form-control" [(ngModel)]="nuevaContrasena" name="nuevaContrasena" required>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="cargando">
      {{ cargando ? 'Guardando...' : 'Guardar contraseña' }}
    </button>
  </form>
  <ng-template #noToken>
    <div class="alert alert-danger">No se proporcionó un token de seguridad válido.</div>
  </ng-template>
</div>
