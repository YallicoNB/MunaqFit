<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Nueva Contraseña</h4>

          <div *ngIf="mensajeError" class="alert alert-danger">
            {{ mensajeError }}
          </div>

          <!-- Solo muestra el formulario si existe un token en la URL -->
          <form *ngIf="token" (ngSubmit)="cambiarPassword()" #form="ngForm">
            <div class="mb-3">
              <label for="nuevaPassword" class="form-label">Nueva contraseña</label>
              <input
                type="password"
                class="form-control"
                id="nuevaPassword"
                name="nuevaPassword"
                [(ngModel)]="nuevaPassword"
                required
                minlength="8"
                [disabled]="cargando">
              <div class="form-text">Mínimo 8 caracteres.</div>
            </div>

            <div class="mb-3">
              <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
              <input
                type="password"
                class="form-control"
                id="confirmarPassword"
                name="confirmarPassword"
                [(ngModel)]="confirmarPassword"
                required
                [disabled]="cargando">
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="form.invalid || cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
              Guardar nueva contraseña
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
