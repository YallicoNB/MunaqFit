<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Nueva Contraseña</h4>

          <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
            {{ mensajeError }}
          </div>

          <!-- Solo muestra el formulario si existe un token en la URL -->
          <form *ngIf="token" [formGroup]="formulario" (ngSubmit)="cambiarPassword()" novalidate>
            <app-input
              label="Nueva contraseña"
              tipo="password"
              formControlName="nuevaPassword"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
              ayuda="Mínimo 8 caracteres"
              [requerido]="true"
              [deshabilitado]="cargando">
            </app-input>

            <app-input
              label="Confirmar contraseña"
              tipo="password"
              formControlName="confirmarPassword"
              placeholder="Repite la contraseña"
              autocomplete="new-password"
              [requerido]="true"
              [deshabilitado]="cargando"
              [error]="errorConfirmar">
            </app-input>

            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              {{ cargando ? 'Guardando…' : 'Guardar nueva contraseña' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
