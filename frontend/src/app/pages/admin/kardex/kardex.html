<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Reporte Kardex (Auditoría)</h1>

  <div class="filtros-panel bg-gray-50 p-4 rounded-lg mb-6 flex flex-wrap gap-4 items-end">
    <div>
      <label>Desde:</label>
      <input type="datetime-local" [(ngModel)]="filtros.fechaDesde" class="border p-2 rounded w-full">
    </div>
    <div>
      <label>Hasta:</label>
      <input type="datetime-local" [(ngModel)]="filtros.fechaHasta" class="border p-2 rounded w-full">
    </div>
    <div>
      <label>Tipo Movimiento:</label>
      <select [(ngModel)]="filtros.tipo" class="border p-2 rounded w-full">
        <option value="">Todos</option>
        <option value="INGRESO">Ingreso</option>
        <option value="SALIDA">Salida</option>
      </select>
    </div>

    <app-boton (accion)="buscarKardex()">Buscar</app-boton>
    <app-boton tipo="secondary" (accion)="limpiarFiltros()">Limpiar</app-boton>
    <app-boton tipo="secondary" (accion)="descargarCSV()">Descargar CSV</app-boton>
  </div>

  <app-spinner *ngIf="cargando" [centrado]="true" etiqueta="Cargando movimientos…"></app-spinner>

  <div *ngIf="!cargando && error" class="bg-red-100 text-red-700 p-4 rounded mb-4" role="alert">
    Ocurrió un problema de conexión al traer el reporte Kardex.
  </div>

  <app-estado-vacio
    *ngIf="!cargando && !error && kardexData.length === 0"
    titulo="Sin movimientos"
    mensaje="No se encontraron registros en el Kardex para estos filtros."
  ></app-estado-vacio>

  <app-tabla
    *ngIf="!cargando && !error && kardexData.length > 0"
    [columnas]="columnas"
    [filas]="kardexData"
    [cargando]="false"
    ariaLabel="Reporte Kardex"
  ></app-tabla>

  <nav class="paginacion" *ngIf="totalPaginas > 1" aria-label="Paginación de kardex">
    <app-boton tamano="sm" tipo="secondary" [deshabilitado]="filtros.pagina === 0" (accion)="irPagina(filtros.pagina - 1)">
      Anterior
    </app-boton>
    <span>Página {{ filtros.pagina + 1 }} de {{ totalPaginas }}</span>
    <app-boton tamano="sm" tipo="secondary" [deshabilitado]="filtros.pagina + 1 >= totalPaginas" (accion)="irPagina(filtros.pagina + 1)">
      Siguiente
    </app-boton>
  </nav>
</div>
