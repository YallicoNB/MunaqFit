<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Proveedores</h2>
    <button class="btn btn-primary" (click)="abrirFormularioNuevo()" *ngIf="!mostrarFormulario">
      + Nuevo Proveedor
    </button>
  </div>

  <!-- Formulario de Crear / Editar -->
  <div class="card shadow-sm mb-4" *ngIf="mostrarFormulario">
    <div class="card-header bg-light">
      <h5 class="mb-0">{{ modoEdicion ? 'Editar Proveedor' : 'Nuevo Proveedor' }}</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardar()" #form="ngForm" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">RUC *</label>
          <input type="text" class="form-control" name="ruc" [(ngModel)]="proveedorActual.ruc" required maxlength="11">
        </div>
        <div class="col-md-5">
          <label class="form-label">Nombre / Razón Social *</label>
          <input type="text" class="form-control" name="nombre" [(ngModel)]="proveedorActual.nombre" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Nombre de Contacto</label>
          <input type="text" class="form-control" name="contactoNombre" [(ngModel)]="proveedorActual.contactoNombre">
        </div>
        <div class="col-md-3">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" name="telefono" [(ngModel)]="proveedorActual.telefono">
        </div>
        <div class="col-12 mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-success" [disabled]="form.invalid || guardando">
            {{ guardando ? 'Guardando...' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="cerrarFormulario()" [disabled]="guardando">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loader -->
  <div class="text-center py-5" *ngIf="cargando">
    <span class="spinner-border text-primary"></span>
    <p class="mt-2 text-muted">Cargando proveedores...</p>
  </div>

  <!-- Tabla de Proveedores -->
  <div class="card shadow-sm" *ngIf="!cargando">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>RUC</th>
            <th>Razón Social</th>
            <th>Contacto</th>
            <th>Teléfono</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of proveedores">
            <td>#{{ p.id }}</td>
            <td>{{ p.ruc }}</td>
            <td class="fw-semibold">{{ p.nombre }}</td>
            <td>{{ p.contactoNombre || '-' }}</td>
            <td>{{ p.telefono || '-' }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-2" (click)="abrirFormularioEdicion(p)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="eliminar(p)">Eliminar</button>
            </td>
          </tr>
          <tr *ngIf="proveedores.length === 0">
            <td colspan="6" class="text-center py-4 text-muted">No hay proveedores registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
