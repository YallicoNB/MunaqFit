<article class="promocion-card">
  <img class="promocion-imagen" [src]="promocion.imagen" [alt]="promocion.textoAlternativo" />
  <div class="promocion-contenido">
    <span class="promocion-etiqueta">Promoción</span>
    <h3>{{ promocion.titulo }}</h3>
    <p>{{ promocion.descripcion }}</p>
  </div>
</article>
