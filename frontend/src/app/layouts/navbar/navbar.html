<nav class="navbar">
  <a routerLink="/home" class="navbar-brand">MunaqFit</a>

  <div class="navbar-links">
    <a
      *ngFor="let enlace of enlaces()"
      class="navbar-item"
      [routerLink]="enlace.ruta"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ enlace.texto }}
    </a>
  </div>

  <span class="navbar-user" *ngIf="nombreUsuario()">{{ nombreUsuario() }}</span>
</nav>
