<!-- Fijo arriba a la derecha, encima de todo el contenido -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090">
  <div
    *ngFor="let toast of toasts()"
    class="toast show align-items-center border-0 mb-2 {{ tipoClase(toast.tipo) }}"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">
        <strong class="d-block">{{ toast.title }}</strong>
        <div>{{ toast.message }}</div>
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        aria-label="Cerrar"
        (click)="cerrar(toast.id)"
      ></button>
    </div>
  </div>
</div>
